<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diasoft JS Course</title>
  <style>
    :root {
      --font-family: Segoe UI, sans-serif;
      --border-color: #cbd5e1;
      --background: #ffffff;

      --select-icon-color: #64748b;
      --select-border-color-hover: #94a3b8;
      --select-button-border-color: #cccccc;
      --select-search-border-color: #dbe2ea;
      --select-search-background: #f8fafc;
      --select-option-hover-background: #f1f5f9;
    }
  </style>
</head>
<body>
<my-panel header="Custom Select Panel" sub-header="Выберите страну из списка">
  <p>
    Страна — территория, выделяемая по географическому положению, физико-географическим условиям либо государственно-политической принадлежности (суверенные государства, зависимые территории и владения).
  </p>
  <my-select>
    <input slot="search" class="select-popup-search" type="search" placeholder="Поиск страны" />
    <option value="russia">Россия</option>
    <option value="china">Китай</option>
    <option value="mongolia">Монголия</option>
  </my-select>
</my-panel>
<script>
  const components = ['my-select', 'my-panel'];

  const onLoad = (event) => {
    const componentName = event.currentTarget.dataset.name;

    if (componentName === 'my-select') {
      customElements.define(componentName, MySelect);
    }
    if (componentName === 'my-panel') {
      customElements.define(componentName, MyPanel);
    }
  };

  const onError = (err) => {
    console.error('Не удалось загрузить веб-компонент:', err);
  };

  document.addEventListener('DOMContentLoaded', () => {
    components.forEach((component) => {
      const script = document.createElement('script');

      script.src = `./${component}.js`;
      script.defer = true;
      script.dataset.name = component;
      script.addEventListener('load', onLoad);
      script.addEventListener('error', onError);

      document.body.append(script);
    });
  });
</script>
</body>
</html>
