<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diasoft JS Course</title>
</head>
<body>
<script>
  const onLoad = (event) => {
    const componentName = event.currentTarget.dataset.name;
    const componentElement = document.createElement(componentName);
    document.body.append(componentElement);
  };

  const onError = (err) => {
    console.error('Не удалось загрузить веб-компонент:', err);
  };

  const components = ['my-select'];

  document.addEventListener('DOMContentLoaded', () => {
    components.forEach((component) => {
      const script = document.createElement('script');

      script.src = `./${component}.js`;
      script.defer = true;
      script.dataset.name = component;
      script.addEventListener('load', onLoad);
      script.addEventListener('error', onError);

      document.body.append(script);
    });
  });
</script>
</body>
</html>
